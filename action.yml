name: 'Brio Trajectory Checker'
description: 'Grade an AI agent trajectory against a YAML spec'
inputs:
  spec:
    description: 'Path to the YAML spec file'
    required: true
  trace:
    description: 'Path to a single JSONL trace file'
    required: false
    default: ''
  traces:
    description: 'Path to a directory of JSONL trace files'
    required: false
    default: ''
  format:
    description: 'Output format (text, json, or github)'
    required: false
    default: 'github'
  version:
    description: 'Brio release version to download'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Download Brio binary
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        if [ "$OS" = "macos" ]; then
          OS="darwin"
        fi

        ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        if [ "$ARCH" = "x64" ]; then
          ARCH="amd64"
        fi

        EXT=""
        if [ "$OS" = "windows" ]; then
          EXT=".exe"
        fi

        BIN_NAME="brio-${OS}-${ARCH}${EXT}"
        VER="$INPUT_VERSION"

        if [ "$VER" = "latest" ]; then
          URL="https://github.com/iokuru/brio/releases/latest/download/${BIN_NAME}"
        else
          URL="https://github.com/iokuru/brio/releases/download/${VER}/${BIN_NAME}"
        fi

        echo "Downloading Brio from ${URL}..."
        curl -sSL -f -o "brio${EXT}" "${URL}"
        chmod +x "brio${EXT}"

    - name: Run Brio check
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        INPUT_SPEC: ${{ inputs.spec }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TRACE: ${{ inputs.trace }}
        INPUT_TRACES: ${{ inputs.traces }}
      run: |
        EXT=""
        if [ "$RUNNER_OS" = "Windows" ]; then
          EXT=".exe"
        fi

        CMD=("./brio${EXT}" check --spec "$INPUT_SPEC" --format "$INPUT_FORMAT")
        if [ -n "$INPUT_TRACE" ]; then
          CMD+=(--trace "$INPUT_TRACE")
        elif [ -n "$INPUT_TRACES" ]; then
          CMD+=(--traces "$INPUT_TRACES")
        else
          echo "Error: either trace or traces input must be specified"
          exit 2
        fi

        "${CMD[@]}"
